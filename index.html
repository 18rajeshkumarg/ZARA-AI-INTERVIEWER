<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/ZARA-AI-INTERVIEWER/indicasoftware-logo.svg"
    />
    <link rel="apple-touch-icon" href="/ZARA-AI-INTERVIEWER/indicasoftware-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <!--
      Fonts load non-blocking. A blocking @import delays first paint until
      fonts.googleapis.com responds, which shows as a blank page on slow or
      restricted networks. Fallback fonts render immediately.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <meta name="description" content="ZARA AI Interview by Indica Software - apply for a role, verify your face with YOLO, complete two virtual Zoom rounds and meet the Boss in person." />
    <title>ZARA · AI Interview | Indica Software Careers</title>
    <style>
      html, body { background: #f7f7f8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var started = false;
        var shown = false;
        var root = document.getElementById("root");
        var timer = null;

        function appMounted() {
          return !!(root && root.children.length > 0);
        }

        function clear() {
          if (timer) window.clearInterval(timer);
          timer = null;
        }

        function show() {
          if (shown || appMounted() || recovering) return;
          shown = true;
          clear();
          var box = document.createElement("div");
          box.setAttribute("role", "alert");
          box.style.cssText =
            "font-family:system-ui,sans-serif;max-width:640px;margin:12vh auto;padding:28px;border:1px solid #d4d4d8;border-radius:12px;background:#fff;color:#18181b;line-height:1.55";
          box.innerHTML =
            '<h1 style="margin:0 0 8px;font-size:22px">ZARA AI Interview</h1>' +
            '<p style="margin:0 0 18px;color:#52525b">This page could not finish loading. Your browser may be holding an older cached copy of the site.</p>' +
            '<button id="zara-reload" style="font:inherit;padding:12px 20px;border:0;border-radius:8px;background:#e5002d;color:#fff;cursor:pointer;font-weight:700">Reload the latest version</button>' +
            '<p style="margin:16px 0 0;font-size:13px;color:#71717a">Still stuck? Press Ctrl+Shift+R (or Cmd+Shift+R) to force a refresh.</p>';
          (root || document.body).appendChild(box);
          document
            .getElementById("zara-reload")
            .addEventListener("click", function () {
              location.replace(location.pathname + "?v=" + Date.now() + location.hash);
            });
        }

        var recovering = false;

        function entryScriptSrc() {
          var el = document.querySelector('script[type="module"][src]');
          return el ? el.src : "";
        }

        function recover() {
          if (recovering || shown || appMounted() || window.__ZARA_APP_STARTED__) {
            return;
          }
          var src = entryScriptSrc();
          if (!src || /\.tsx?$/.test(src)) {
            show();
            return;
          }
          recovering = true;
          var tries = 0;

          function attempt() {
            var fresh =
              src + (src.indexOf("?") < 0 ? "?" : "&") + "z=" + Date.now() + "-" + tries;
            fetch(fresh, { cache: "no-store" })
              .then(function (res) {
                if (!res.ok) throw new Error("HTTP " + res.status);
                return res.text();
              })
              .then(function (code) {
                recovering = false;
                return import(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
              })
              .catch(function () {
                tries += 1;
                if (tries >= 4) {
                  recovering = false;
                  show();
                } else {
                  window.setTimeout(attempt, 1500);
                }
              });
          }

          attempt();
        }

        function watch() {
          if (window.__ZARA_APP_STARTED__) {
            started = true;
            clear();
            timer = window.setInterval(function () {
              if (appMounted()) {
                clear();
                return;
              }
              show();
            }, 1000);
            window.setTimeout(function () {
              if (!appMounted()) show();
            }, 20000);
            return;
          }
          if (appMounted()) {
            clear();
            return;
          }
          var waited = Date.now() - began;
          if (waited > 45000) recover();
        }

        var began = Date.now();

        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target.tagName === "SCRIPT" && target.src) {
              window.setTimeout(function () {
                if (appMounted()) return;
                recover();
              }, 4000);
            }
          },
          true
        );
        timer = window.setInterval(watch, 500);
      })();
    </script>
  </body>
</html>
