<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/ZARA-AI-INTERVIEWER/indicasoftware-logo.svg"
    />
    <link rel="apple-touch-icon" href="/ZARA-AI-INTERVIEWER/indicasoftware-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <!--
      Fonts load non-blocking. A blocking @import delays first paint until
      fonts.googleapis.com responds, which shows as a blank page on slow or
      restricted networks. Fallback fonts render immediately.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <meta name="description" content="ZARA AI Interview by Indica Software - apply for a role, verify your face with YOLO, complete two virtual Zoom rounds and meet the Boss in person." />
    <title>ZARA · AI Interview | Indica Software Careers</title>
    <style>
      html, body { background: #f7f7f8; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family:system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:28px;border:1px solid #d4d4d8;border-radius:12px;background:#fff;color:#18181b;line-height:1.55">
        <h1 style="margin:0 0 8px;font-size:22px">ZARA AI Interview</h1>
        <p style="margin:0;color:#52525b">This site needs JavaScript. Please enable JavaScript in your browser and reload the page.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Fallback for a bundle that never starts: offline, a blocked request, a
      // deploy in progress or a script that failed to execute. It only appears
      // when nothing at all rendered, and it never blames the browser cache.
      // Render errors are handled inside the app by its error boundary.
      (function () {
        var shown = false;
        function appMounted() {
          var root = document.getElementById("root");
          return !!(root && root.children.length > 0);
        }
        function show() {
          if (shown || appMounted()) return;
          shown = true;
          var box = document.createElement("div");
          box.setAttribute("role", "alert");
          box.style.cssText =
            "font-family:system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:28px;border:1px solid #d4d4d8;border-radius:12px;background:#fff;color:#18181b;line-height:1.55";
          box.innerHTML =
            '<h1 style="margin:0 0 8px;font-size:22px">ZARA AI Interview</h1>' +
            '<p style="margin:0 0 18px;color:#52525b">The app could not start. Check your connection, then reload the page.</p>' +
            '<button onclick="location.reload()" style="font:inherit;padding:12px 20px;border:0;border-radius:8px;background:#e5002d;color:#fff;cursor:pointer;font-weight:700">Reload the page</button>';
          document.body.appendChild(box);
        }
        window.addEventListener(
          "error",
          function (event) {
            var target = event.target;
            if (target && target.tagName === "SCRIPT" && target.src) {
              // The entry bundle itself failed to download.
              window.setTimeout(show, 1500);
              return;
            }
            if (target === window || event.error) {
              // The bundle downloaded but threw before React could render.
              window.setTimeout(show, 2500);
            }
          },
          true
        );
      })();
    </script>
    <script nomodule>
      document.getElementById("root").innerHTML =
        '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:12vh auto;padding:28px;border:1px solid #d4d4d8;border-radius:12px;background:#fff;color:#18181b;line-height:1.55"><h1 style="margin:0 0 8px;font-size:22px">ZARA AI Interview</h1><p style="margin:0;color:#52525b">This browser is too old to run the site. Please open it in a current version of Chrome, Edge, Firefox or Safari.</p></div>';
    </script>
  </body>
</html>
