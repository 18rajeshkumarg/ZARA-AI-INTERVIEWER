# Provisioning this Blueprint creates billable resources: a paid web service,
# a persistent disk for candidate files, and managed PostgreSQL.
services:
  - type: web
    name: zara-ai-interviewer-api
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:api
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: candidate-files
      mountPath: /opt/render/project/src/server/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/server/data
      - key: DATABASE_URL
        fromDatabase:
          name: zara-interviewer-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://18rajeshkumarg.github.io
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: zara-interviewer-db
    databaseName: zara_interviews
    user: zara_interviewer
    plan: 0.1c-256mb
    region: oregon
